<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - TL On The Road Curitiba</title>
    <style>
        body {font-family:Arial,sans-serif;margin:20px;padding:20px;}
        label { font-weight:bold;display:block;margin-top:10px;}
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; }
        .participant-fields { margin-top: 15px; border: 1px solid #ccc; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Inscrição - TL On The Road Curitiba</h2>
    <form id="registrationForm">
        <label>CNPJ:</label>
        <input type="text" name="cnpj" required>
        
        <label>Nome Fantasia:</label>
        <input type="text" name="nomeFantasia" required>
        
        <label>Inscrição Estadual (IE):</label>
        <input type="text" name="ie">
        
        <label>Endereço:</label>
        <input type="text" name="endereco" required>
        
        <label>CEP:</label>
        <input type="text" name="cep" required>
        
        <label>Email para NF:</label>
        <input type="email" name="emailNF" required>
        
        <label>Telefone do Financeiro:</label>
        <input type="tel" name="telefoneFinanceiro" required>
        
        <label>Quantidade de Participantes:</label>
        <select id="numParticipants" onchange="generateParticipantFields()">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        
        <div id="participantsContainer"></div>
        
        <h3>Escolha a Forma de Pagamento:</h3>
        <button type="button" onclick="window.location.href='https://linkdopagamento.com'">Pagar com Cartão</button>
        <button type="button" onclick="alert('Chave PIX: 000.000.000-00')">Pagar via PIX</button>
    </form>
    
    <script>
        function generateParticipantFields() {
            const container = document.getElementById("participantsContainer");
            container.innerHTML = ""; 
            const num = document.getElementById("numParticipants").value;
            for (let i = 1; i <= num; i++) {
                const div = document.createElement("div");
                div.className = "participant-fields";
                div.innerHTML = `
                    <label>Nome Completo do Participante ${i}:</label>
                    <input type="text" name="participante${i}" required>
                    <label>WhatsApp do Participante ${i}:</label>
                    <input type="tel" name="whatsapp${i}" required>
                `;
                container.appendChild(div);
            }
        }
    </script>
</body>
</html>

